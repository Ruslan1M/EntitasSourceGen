name: generator

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test generator
        env:
          DiffEngine_Disabled: 'true'
        run: dotnet test Generator/EntitasSourceGen.sln -c Release
